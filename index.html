<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Space Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>🚀 SPACE MUSIC</header>

  <main>
    <section id="tab-home" class="tab active">
      <h2>Недавно слушали</h2>
      <div id="recent-list"></div>
    </section>

    <section id="tab-search" class="tab">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Песня или артист...">
        <button id="search-btn">🔍</button>
      </div>
      <div id="search-results"></div>
    </section>

    <section id="tab-library" class="tab">
      <h2>❤️ Любимые треки</h2>
      <div id="fav-list"></div>
    </section>

    <section id="tab-events" class="tab">
      <h2>🎸 Концерты</h2>
      <p class="hint">Раздел подключим позже — на шаге с афишами</p>
    </section>
  </main>

  <div id="mini-player" class="hidden">
    <img id="mp-cover" src="" alt="">
    <div id="mp-info">
      <div id="mp-title"></div>
      <div id="mp-artist"></div>
    </div>
    <button id="mp-play">▶</button>
    <button id="mp-expand">⌃</button>
  </div>

  <nav>
    <button class="nav-btn active" data-tab="home"><span>🏠</span>Главная</button>
    <button class="nav-btn" data-tab="search"><span>🔍</span>Поиск</button>
    <button class="nav-btn" data-tab="library"><span>❤️</span>Моя музыка</button>
    <button class="nav-btn" data-tab="events"><span>🎸</span>Концерты</button>
  </nav>

  <div id="full-player" class="hidden">
    <button id="fp-close">⌄</button>
    <button id="fp-fav">🤍</button>
    <img id="fp-cover" src="" alt="">
    <div id="fp-title"></div>
    <div id="fp-artist"></div>
    <input type="range" id="fp-progress" value="0" min="0" max="100">
    <div id="fp-time">0:00 / 0:00</div>
    <div class="fp-controls">
      <button id="fp-prev">⏮</button>
      <button id="fp-play">▶</button>
      <button id="fp-next">⏭</button>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="app.js"></script>
</body>
</html>
