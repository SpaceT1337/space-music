<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Space Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #1b1b3a, #0a0a14);
      color: #fff;
      font-family: -apple-system, Roboto, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh;
    }
    h1 { font-size: 28px; letter-spacing: 2px; }
    p  { margin-top: 12px; color: #9a9ab8; }
  </style>
</head>
<body>
  <h1>🚀 SPACE MUSIC</h1>
  <p id="hello">Подключение к Телеграму...</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const name = tg.initDataUnsafe?.user?.first_name || "космонавт";
    document.getElementById("hello").textContent =
      "Привет, " + name + "! Приложение подключено ✅";
  </script>
</body>
</html>
